apiVersion: v1
kind: ReplicaSet
metadata: 
  name: replicaset
  labels:
    names: roboshop
    env: dev
    language: yaml
    purpose: replicaset
spec:
  replicas: 2
  selector:
    matchLabels:
    names: roboshop
    env: dev
    language: yaml
    purpose: replicaset
  template:
    metadata:
    labels:
    names: roboshop
    env: dev
    language: yaml
    purpose: replicaset

  spec:
    containers:
    - name: nginx
      image: nginx:trixie-perl
---
apiVersion: v1
kind: Service
metadata:
  name: replicaset
spec:
  type: LoadBalancer
  selector:
    names: roboshop
    env: dev
    language: yaml
    purpose: replicaset
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: replicaset
spec:
  type: ClusterIp
  selector:
    names: roboshop
    env: dev
    language: yaml
    purpose: replicaset
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80